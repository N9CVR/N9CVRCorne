# Peripheral-safe overrides. These clear central-only settings that may have
# been enabled in a shared corne.conf; they do not enable USB or WPM.
CONFIG_ZMK_USB=n
CONFIG_ZMK_WPM=n
CONFIG_ZMK_WIDGET_WPM_STATUS=n
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=n
CONFIG_ZMK_WIDGET_LAYER_STATUS=n
CONFIG_ZMK_WIDGET_BATTERY_STATUS=n
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=n
CONFIG_ZMK_WIDGET_PERIPHERAL_STATUS=y
