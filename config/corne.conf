# PandaKB Corne V3 MX
# SuperMini nRF52840 / ZMK v0.3
 
# RGB underglow and per-key addressable LEDs
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
 
# OLED display
CONFIG_ZMK_DISPLAY=y
 
# Bluetooth settings retained for Windows and Linux compatibility
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
# CONFIG_ZMK_BLE_PASSKEY_ENTRY=y
 
# Device name
CONFIG_ZMK_KEYBOARD_NAME="PandaKB Corne"
