# PandaKB Corne V3 MX / SuperMini nRF52840 starter configuration

# Addressable RGB chain: 21 per-key + 6 underglow LEDs on each half.
CONFIG_ZMK_RGB_UNDERGLOW=y

# Stock Corne OLED support.
CONFIG_ZMK_DISPLAY=y

# Preserve the BLE settings proven by the owner on Windows and Linux.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
# CONFIG_ZMK_BLE_PASSKEY_ENTRY=y

# Friendly USB/Bluetooth device name.
CONFIG_ZMK_KEYBOARD_NAME="PandaKB Corne"
