# PandaKB Corne V3 MX
# SuperMini nRF52840 / ZMK v0.3
 
# RGB underglow and per-key addressable LEDs
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
 
# OLED display
CONFIG_ZMK_DISPLAY=y
#CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# Fun OLED features
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_WIDGET_WPM_STATUS=y
 
# Bluetooth settings retained for Windows and Linux compatibility
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# Use the keyboard to move the mouse 
CONFIG_ZMK_POINTING=y
 
# Device name
CONFIG_ZMK_KEYBOARD_NAME="N9CVRCorne"

# UEFI/Boot Compatibility
CONFIG_ZMK_USB_BOOT=y
